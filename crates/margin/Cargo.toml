[package]
# Registry identity (ADR-0025): the `margin` name belongs to an unrelated
# project, so the executable package publishes as `margin-review`. The
# installed command stays `margin` via [[bin]] below.
name = "margin-review"
description = "A fast, keyboard-first terminal diff viewer for Git changes, patches, and AI-authored code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "margin"
path = "src/main.rs"
bench = false

[dependencies]
margin-core.workspace = true
margin-vcs.workspace = true
margin-tui.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
notify.workspace = true
terminal-colorsaurus = "1.0.3"
clap_complete = "4.6.8"
clap_mangen = "0.3.0"

[dev-dependencies]
tempfile.workspace = true
# Building real repos for `margin undo` binary tests.
git2.workspace = true

[lints]
workspace = true
