name: Advisories

# cargo-deny fetches the RUSTSEC database live, so a new advisory fails
# whichever unrelated PR runs CI next (git2 on 2026-06-24, quick-xml on
# 2026-07-03). This daily run pins the failure to main with an honest
# name instead.

on:
  schedule:
    - cron: "0 5 * * *" # daily, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories
