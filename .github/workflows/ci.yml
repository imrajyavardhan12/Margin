name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Least privilege (ADR-0024): every job checks out and runs commands;
# none needs more than reading the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: action pins + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Pinned binary like the mdBook install in pages.yml: no new
      # third-party action dependency for a lint step.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin actionlint
          actionlint --version
      # release.yml is generated by cargo-dist and owned upstream: its
      # shell style is dist's to fix, so actionlint covers the four
      # hand-written workflows. Its action pins are still enforced by
      # the SHA check below, which scans every workflow file.
      - run: actionlint .github/workflows/ci.yml .github/workflows/fuzz.yml .github/workflows/pages.yml .github/workflows/advisories.yml .github/workflows/smoke.yml
      # SHA enforcement (ADR-0024): every third-party action must be
      # pinned to a full commit SHA. Hand-written workflows also carry a
      # readable version comment so Dependabot can keep updating them;
      # release.yml is generated by cargo-dist (pins come from
      # [dist.github-action-commits] in dist-workspace.toml, which
      # dist emits without comments), so it is SHA-only by design.
      # Local (`./`) and Docker refs are exempt. This job is a required
      # check: no mutable action reference can merge.
      - name: Verify every action is SHA-pinned
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          bad = []
          uses = re.compile(r"^\s*-\s*uses:\s*(\S+?)(?:\s+#\s*(\S+))?\s*$")
          pinned = re.compile(r"[^@]+@[0-9a-f]{40}$")
          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              generated = path.name == "release.yml"
              for n, line in enumerate(path.read_text().splitlines(), 1):
                  m = uses.match(line)
                  if not m:
                      continue
                  ref, comment = m.group(1), m.group(2)
                  if ref.startswith(("./", "docker://")):
                      continue
                  if not pinned.fullmatch(ref) or (not generated and not comment):
                      bad.append(f"{path}:{n}: {line.strip()}")
          if bad:
              print("mutable or uncommented action refs:")
              print("\n".join(bad))
              sys.exit(1)
          print("all actions SHA-pinned")
          PY
  check:
    name: fmt + clippy + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2
        with:
          tool: cargo-deny
      # Deterministic checks only: `advisories` compares against a live
      # database, so a new RUSTSEC entry would fail whichever unrelated PR
      # runs next. The scheduled advisories workflow owns that signal.
      - run: cargo deny check licenses bans sources

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --workspace --all-targets

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  bench:
    name: bench (informational)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo bench --workspace -- --quick 2>&1 | grep -E "time:|^[a-z_/]+" | head -40

  # Added by issue #8: fuzz-smoke (60s on PRs touching margin-core)
  # release.yml is generated/owned by cargo-dist (dist generate)
